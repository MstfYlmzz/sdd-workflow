name: PowerShell tests

on:
  push:
    branches: [main, 'feature/**', 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git identity
        shell: pwsh
        run: |
          git config --global user.email "sdd-ci@example.invalid"
          git config --global user.name "SDD CI"
      - name: Run test suite
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/run-all.ps1
      - name: Set up Python for Spec Kit
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Spec Kit 1.0.6
        run: python -m pip install "git+https://github.com/github/spec-kit.git@v1.0.6"
      - name: Run Spec Kit workflow E2E
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/spec-kit-workflow.e2e.ps1
